<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Abrahangs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* ── Base (dark) ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      transition: background 0.15s, color 0.15s;
    }

    /* ── HANGING STATE: full white inversion ── */
    body.s-hanging {
      background: #ffffff;
      color: #000;
    }
    body.s-hanging .card         { background: #f2f2f2; border-color: #ddd; }
    body.s-hanging h1            { color: #aaa; }
    body.s-hanging .ex-number    { color: #888; }
    body.s-hanging .ex-name      { color: #000; }
    body.s-hanging .ex-grip      { color: #666; }
    body.s-hanging .badge        { background: #000; color: #fff; }
    body.s-hanging .timer        { color: #000; }
    body.s-hanging .rep-label    { color: #888; }
    body.s-hanging .dot          { background: #ccc; }
    body.s-hanging .dot.done     { background: #000; }
    body.s-hanging .dot.current  { background: #000; box-shadow: 0 0 6px #0005; }
    body.s-hanging .prog-wrap    { background: #ddd; }
    body.s-hanging .prog-fill    { background: #000; }
    body.s-hanging .btn-main     { background: #000; color: #fff; }
    body.s-hanging .btn-reset    { background: #ddd; color: #666; }
    body.s-hanging .next-label   { color: #aaa; }
    body.s-hanging .next-label span { color: #555; }
    body.s-hanging .hist-section { opacity: 0.4; }

    h1 {
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      color: #333;
      margin-bottom: 20px;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .card {
      background: #141414;
      border-radius: 22px;
      padding: 26px 22px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid #1e1e1e;
      transition: background 0.15s, border-color 0.15s;
    }

    .ex-number { font-size: 0.7rem; color: #3a3a3a; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; transition: color 0.15s; }
    .ex-name   { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; min-height: 1.7rem; transition: color 0.15s; }
    .ex-grip   { font-size: 0.8rem; color: #4a4a4a; margin-bottom: 18px; line-height: 1.4; min-height: 2rem; transition: color 0.15s; }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 5px 20px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .badge.prep { background: #2a1f00; color: #fbbf24; }
    .badge.hang { background: #000; color: #fff; }
    .badge.rest { background: #0d1e2e; color: #60a5fa; }
    .badge.idle { background: #1e1e1e; color: #444; }
    .badge.done { background: #1a2e0d; color: #a3e635; }

    /* Timer — big enough to read from the floor */
    .timer {
      font-size: 8.5rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 12px;
      transition: color 0.15s;
      letter-spacing: -0.02em;
    }
    .timer.prep { color: #fbbf24; }
    .timer.hang { color: #000; }
    .timer.rest { color: #fff; }
    .timer.idle { color: #2a2a2a; }
    .timer.done { color: #a3e635; }

    /* Rep dots */
    .rep-label { font-size: 0.74rem; color: #3a3a3a; margin-bottom: 10px; min-height: 1rem; transition: color 0.15s; }
    .rep-dots  { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; min-height: 12px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #1e1e1e; transition: background 0.2s; }
    .dot.done    { background: #4ade80; }
    .dot.current { background: #fff; box-shadow: 0 0 7px #ffffff44; }

    /* Progress */
    .prog-wrap { width: 100%; height: 3px; background: #1c1c1c; border-radius: 2px; overflow: hidden; margin-bottom: 20px; transition: background 0.15s; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #fff); border-radius: 2px; transition: width 0.4s; }

    /* Buttons */
    .btns { display: flex; gap: 10px; justify-content: center; }
    .btn {
      padding: 16px 0;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      max-width: 165px;
      transition: opacity 0.15s, transform 0.1s, background 0.15s, color 0.15s;
      touch-action: manipulation;
    }
    .btn:active { opacity: 0.65; transform: scale(0.96); }
    .btn-main  { background: #fff; color: #000; }
    .btn-reset { background: #1e1e1e; color: #555; }

    /* Next exercise */
    .next-label { font-size: 0.76rem; color: #2e2e2e; text-align: center; margin-bottom: 26px; min-height: 18px; transition: color 0.15s; }
    .next-label span { color: #4a4a4a; }

    /* History */
    .hist-section { width: 100%; max-width: 380px; transition: opacity 0.15s; }
    .hist-title   { font-size: 0.68rem; letter-spacing: 0.18em; color: #2e2e2e; text-transform: uppercase; margin-bottom: 10px; }
    .hist-item    { background: #0d0d0d; border: 1px solid #181818; border-radius: 11px; padding: 13px 16px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; }
    .hist-date    { font-size: 0.8rem; color: #555; }
    .hist-status  { font-size: 0.76rem; color: #4ade80; }
    .hist-empty   { color: #222; font-size: 0.8rem; text-align: center; padding: 18px 0; }
  </style>
</head>
<body>

  <h1>Abrahangs</h1>

  <div class="card">
    <div class="ex-number" id="exNum">Ejercicio 1 de 6</div>
    <div class="ex-name"   id="exName">Full Hand Open</div>
    <div class="ex-grip"   id="exGrip">Todos los dedos · Agarre abierto</div>

    <div class="badge idle" id="badge">Listo</div>

    <div class="timer idle" id="timer">5</div>

    <div class="rep-label" id="repLabel">Rep 1 de 6</div>
    <div class="rep-dots"  id="dots"></div>

    <div class="prog-wrap">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>

    <div class="btns">
      <button class="btn btn-main"  id="mainBtn" onclick="handleMain()">Empezar</button>
      <button class="btn btn-reset"             onclick="reset()">Reset</button>
    </div>
  </div>

  <div class="next-label" id="nextLabel"></div>

  <div class="hist-section">
    <div class="hist-title">Historial</div>
    <div id="histList"></div>
  </div>

  <script>
  // ── Exercises ──────────────────────────────────────────────────────────────
  const EX = [
    { name: "Full Hand Open",       grip: "Todos los dedos · Abierto",               reps: 6 },
    { name: "Front 3 Open",         grip: "Índice, mayor, anular (2-3-4) · Abierto", reps: 6 },
    { name: "Front 2 Open",         grip: "Índice y mayor (2-3) · Abierto",           reps: 2 },
    { name: "Middle 2 Open",        grip: "Mayor y anular (3-4) · Abierto",            reps: 2 },
    { name: "Front 2 Half Crimp",   grip: "Índice y mayor (2-3) · Half Crimp",        reps: 2 },
    { name: "Middle 2 Half Crimp",  grip: "Mayor y anular (3-4) · Half Crimp",        reps: 2 },
  ];

  const PREP = 5, HANG = 10, REST = 20;
  const TOTAL_REPS = EX.reduce((s, e) => s + e.reps, 0);

  let state = 'idle', prevState = null;
  let exIdx = 0, rep = 0, tLeft = PREP;
  let iv = null;

  // ── Wake Lock (pantalla siempre encendida) ─────────────────────────────────
  let wakeLock = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* silencioso si no está soportado */ }
  }

  async function releaseWakeLock() {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  }

  // Re-adquirir si la tab vuelve al frente
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (state !== 'idle' && state !== 'done')) {
      requestWakeLock();
    }
  });

  // ── Audio ──────────────────────────────────────────────────────────────────
  const actx = new (window.AudioContext || window.webkitAudioContext)();

  function resumeAudio() {
    return actx.state === 'suspended' ? actx.resume() : Promise.resolve();
  }

  function tone(freq, startAt, duration, vol, type = 'sine') {
    const o = actx.createOscillator();
    const g = actx.createGain();
    // Compressor to prevent clipping at high volumes
    const comp = actx.createDynamicsCompressor();
    o.connect(g); g.connect(comp); comp.connect(actx.destination);
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, startAt);
    g.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    o.start(startAt);
    o.stop(startAt + duration + 0.01);
  }

  function beep(type) {
    resumeAudio().then(() => {
      const t = actx.currentTime;
      if (type === 'tick') {
        // Soft tick during prep countdown
        tone(600, t, 0.08, 0.5, 'sine');
      } else if (type === 'up') {
        // SUBITE — loud ascending, two punchy tones
        tone(440, t,        0.12, 0.9, 'square');
        tone(440, t,        0.12, 0.6, 'sine');
        tone(880, t + 0.14, 0.18, 0.9, 'square');
        tone(880, t + 0.14, 0.18, 0.6, 'sine');
      } else if (type === 'down') {
        // BAJATE — loud descending, two punchy tones
        tone(660, t,        0.14, 0.9, 'square');
        tone(660, t,        0.14, 0.6, 'sine');
        tone(330, t + 0.16, 0.2,  0.9, 'square');
        tone(330, t + 0.16, 0.2,  0.6, 'sine');
      } else if (type === 'done') {
        // Happy arpeggio
        [523, 659, 784, 1047].forEach((f, i) => {
          tone(f, t + i * 0.13, 0.28, 0.7, 'sine');
        });
      }
    });
  }

  // ── Tick ───────────────────────────────────────────────────────────────────
  function tick() {
    tLeft--;

    if (state === 'prep') {
      if (tLeft > 0) {
        beep('tick');
      } else {
        beep('up');
        state = 'hanging';
        tLeft = HANG;
      }
      render(); return;
    }

    if (tLeft <= 0) {
      if (state === 'hanging') {
        beep('down');
        rep++;
        if (rep >= EX[exIdx].reps) {
          exIdx++; rep = 0;
          if (exIdx >= EX.length) {
            clearInterval(iv);
            state = 'done'; tLeft = 0;
            beep('done');
            releaseWakeLock();
            logSession();
            render(); return;
          }
        }
        state = 'resting'; tLeft = REST;
      } else if (state === 'resting') {
        beep('up');
        state = 'hanging'; tLeft = HANG;
      }
    }
    render();
  }

  function startIv() {
    if (iv) clearInterval(iv);
    iv = setInterval(tick, 1000);
  }

  // ── Button ─────────────────────────────────────────────────────────────────
  function handleMain() {
    resumeAudio();
    if (state === 'idle') {
      state = 'prep'; tLeft = PREP;
      beep('tick');
      requestWakeLock();
      startIv();
    } else if (state === 'paused') {
      state = prevState;
      startIv();
    } else if (state === 'done') {
      reset(); return;
    } else {
      prevState = state;
      state = 'paused';
      clearInterval(iv);
    }
    render();
  }

  function reset() {
    clearInterval(iv);
    releaseWakeLock();
    state = 'idle'; exIdx = 0; rep = 0; tLeft = PREP;
    render();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const done    = state === 'done';
    const isPrep  = state === 'prep';
    const safeIdx = Math.min(exIdx, EX.length - 1);
    const ex = EX[safeIdx];

    // Body class for background flip
    document.body.className = state === 'hanging' ? 's-hanging' : '';

    // Exercise info
    document.getElementById('exNum').textContent  = `Ejercicio ${safeIdx + 1} de ${EX.length}`;
    document.getElementById('exName').textContent  = done ? '¡Sesión completa!' : ex.name;
    document.getElementById('exGrip').textContent  = done ? '¡Bien hecho! 💪' : ex.grip;

    // Badge
    const badge = document.getElementById('badge');
    const bMap = {
      prep:    ['prep', '⏱  PREPARATE'],
      hanging: ['hang', '⬆  COLGADO'],
      resting: ['rest', '⬇  DESCANSO'],
      paused:  ['idle', '⏸  PAUSADO'],
      done:    ['done', '✓  COMPLETADO'],
      idle:    ['idle', 'Listo'],
    };
    const [cls, txt] = bMap[state] || ['idle', 'Listo'];
    badge.className = `badge ${cls}`;
    badge.textContent = txt;

    // Timer
    const timerEl = document.getElementById('timer');
    timerEl.textContent = done ? '✓' : tLeft;
    const tClass = { prep:'prep', hanging:'hang', resting:'rest', paused:'idle', done:'done', idle:'idle' };
    timerEl.className = `timer ${tClass[state] || 'idle'}`;

    // Rep dots
    document.getElementById('repLabel').textContent = (done || isPrep) ? '' : `Rep ${rep + 1} de ${ex.reps}`;
    const dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    if (!done && !isPrep) {
      for (let i = 0; i < ex.reps; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < rep ? ' done' : i === rep ? ' current' : '');
        dotsEl.appendChild(d);
      }
    }

    // Progress
    const completedReps = EX.slice(0, safeIdx).reduce((s, e) => s + e.reps, 0) + (done ? ex.reps : rep);
    document.getElementById('progFill').style.width = (completedReps / TOTAL_REPS * 100) + '%';

    // Next label
    const nl = document.getElementById('nextLabel');
    if (isPrep) {
      nl.innerHTML = `Primero: <span>${EX[0].name}</span>`;
    } else if (!done && exIdx < EX.length - 1) {
      nl.innerHTML = `Siguiente: <span>${EX[exIdx + 1].name}</span>`;
    } else if (!done) {
      nl.innerHTML = `<span>Último ejercicio</span>`;
    } else {
      nl.innerHTML = '';
    }

    // Main button label
    const mb = document.getElementById('mainBtn');
    const labels = { idle:'Empezar', prep:'Pausar', paused:'Continuar', done:'Nueva sesión' };
    mb.textContent = labels[state] || 'Pausar';
  }

  // ── History ────────────────────────────────────────────────────────────────
  function logSession() {
    const h = JSON.parse(localStorage.getItem('abrahangs_log') || '[]');
    h.unshift({ ts: new Date().toISOString() });
    localStorage.setItem('abrahangs_log', JSON.stringify(h.slice(0, 50)));
    renderHist();
  }

  function renderHist() {
    const h = JSON.parse(localStorage.getItem('abrahangs_log') || '[]');
    const el = document.getElementById('histList');
    if (!h.length) { el.innerHTML = '<div class="hist-empty">No hay sesiones todavía</div>'; return; }
    el.innerHTML = h.slice(0, 15).map(e => {
      const d = new Date(e.ts);
      const ds = d.toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' });
      const ts = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
      return `<div class="hist-item">
        <div class="hist-date">${ds} · ${ts}</div>
        <div class="hist-status">✓ Completada</div>
      </div>`;
    }).join('');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  render();
  renderHist();
  </script>
</body>
</html>
