<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Abrahangs Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      color: #444;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .card {
      background: #141414;
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #1e1e1e;
    }

    .ex-number {
      font-size: 0.72rem;
      color: #444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .ex-name {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .ex-grip {
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    /* Phase badge */
    .badge {
      display: inline-block;
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .badge.hang  { background: #0d2e1a; color: #4ade80; }
    .badge.rest  { background: #0d1e2e; color: #60a5fa; }
    .badge.idle  { background: #1e1e1e; color: #555; }
    .badge.done  { background: #1e2e0d; color: #a3e635; }

    /* Timer */
    .timer {
      font-size: 7rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 14px;
      transition: color 0.3s;
    }
    .timer.hang { color: #4ade80; }
    .timer.rest { color: #60a5fa; }
    .timer.idle { color: #333; }
    .timer.done { color: #a3e635; }

    /* Rep dots */
    .rep-label {
      font-size: 0.78rem;
      color: #444;
      margin-bottom: 10px;
    }

    .rep-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #222;
      transition: background 0.25s;
    }
    .dot.done    { background: #4ade80; }
    .dot.current { background: #fff; box-shadow: 0 0 6px #fff4; }

    /* Progress bar */
    .prog-wrap {
      width: 100%;
      height: 3px;
      background: #1e1e1e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #60a5fa);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Buttons */
    .btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      flex: 1;
      max-width: 160px;
    }
    .btn:active { opacity: 0.7; transform: scale(0.97); }

    .btn-main  { background: #4ade80; color: #000; }
    .btn-reset { background: #1e1e1e; color: #777; }

    /* Next exercise */
    .next-label {
      font-size: 0.78rem;
      color: #333;
      text-align: center;
      margin-bottom: 28px;
      height: 18px;
    }
    .next-label span { color: #555; }

    /* History */
    .hist-section {
      width: 100%;
      max-width: 380px;
    }

    .hist-title {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hist-item {
      background: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hist-date { font-size: 0.82rem; color: #666; }
    .hist-status { font-size: 0.78rem; color: #4ade80; }

    .hist-empty {
      color: #2a2a2a;
      font-size: 0.82rem;
      text-align: center;
      padding: 20px 0;
    }

    /* Done state full card */
    .done-msg {
      font-size: 1.1rem;
      color: #a3e635;
      margin-bottom: 6px;
    }
    .done-sub {
      font-size: 0.82rem;
      color: #444;
      margin-bottom: 22px;
    }
  </style>
</head>
<body>

  <h1>Abrahangs Timer</h1>

  <div class="card" id="mainCard">
    <div class="ex-number" id="exNum">Ejercicio 1 de 6</div>
    <div class="ex-name"   id="exName">Full Hand Open</div>
    <div class="ex-grip"   id="exGrip">Todos los dedos · Agarre abierto</div>

    <div class="badge idle" id="badge">Listo</div>

    <div class="timer idle" id="timer">10</div>

    <div class="rep-label" id="repLabel">Rep 1 de 6</div>
    <div class="rep-dots"  id="dots"></div>

    <div class="prog-wrap">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>

    <div class="btns">
      <button class="btn btn-main"  id="mainBtn"  onclick="handleMain()">Empezar</button>
      <button class="btn btn-reset" id="resetBtn" onclick="reset()">Reset</button>
    </div>
  </div>

  <div class="next-label" id="nextLabel"></div>

  <div class="hist-section">
    <div class="hist-title">Historial</div>
    <div id="histList"></div>
  </div>

  <script>
  // ── Exercises ──────────────────────────────────────────────────────────────
  const EX = [
    { name: "Full Hand Open",      grip: "Todos los dedos · Abierto",                    reps: 6 },
    { name: "Front 3 Open",        grip: "Índice, mayor, anular (2-3-4) · Abierto",      reps: 6 },
    { name: "Front 2 Open",        grip: "Índice y mayor (2-3) · Abierto",               reps: 2 },
    { name: "Middle 2 Open",       grip: "Mayor y anular (3-4) · Abierto",               reps: 2 },
    { name: "Front 2 Half Crimp",  grip: "Índice y mayor (2-3) · Half Crimp",            reps: 2 },
    { name: "Middle 2 Half Crimp", grip: "Mayor y anular (3-4) · Half Crimp",            reps: 2 },
  ];

  const HANG = 10, REST = 20;
  const TOTAL_REPS = EX.reduce((s, e) => s + e.reps, 0); // 20

  // ── State ──────────────────────────────────────────────────────────────────
  let state  = 'idle'; // idle | hanging | resting | paused | done
  let prevState = null;
  let exIdx  = 0;
  let rep    = 0;
  let tLeft  = HANG;
  let iv     = null;

  // ── Audio ──────────────────────────────────────────────────────────────────
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  function beep(type) {
    const resume = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
    resume.then(() => {
      if (type === 'up') {
        // Ascending bright tones — SUBITE
        [440, 660].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = f;
          const t = ctx.currentTime + i * 0.18;
          g.gain.setValueAtTime(0.45, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          o.start(t); o.stop(t + 0.22);
        });
      } else if (type === 'down') {
        // Descending mellow tones — BAJATE
        [550, 370].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = f;
          const t = ctx.currentTime + i * 0.2;
          g.gain.setValueAtTime(0.4, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          o.start(t); o.stop(t + 0.28);
        });
      } else if (type === 'done') {
        // Happy arpeggio
        [523, 659, 784, 1047].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine'; o.frequency.value = f;
          const t = ctx.currentTime + i * 0.13;
          g.gain.setValueAtTime(0.3, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          o.start(t); o.stop(t + 0.3);
        });
      }
    });
  }

  // ── Timer logic ────────────────────────────────────────────────────────────
  function tick() {
    tLeft--;

    if (tLeft <= 0) {
      if (state === 'hanging') {
        beep('down');
        rep++;

        if (rep >= EX[exIdx].reps) {
          exIdx++;
          rep = 0;

          if (exIdx >= EX.length) {
            clearInterval(iv);
            state = 'done';
            tLeft = 0;
            beep('done');
            logSession();
            render();
            return;
          }
        }

        state = 'resting';
        tLeft = REST;

      } else if (state === 'resting') {
        beep('up');
        state = 'hanging';
        tLeft = HANG;
      }
    }

    render();
  }

  function startIv() {
    if (iv) clearInterval(iv);
    iv = setInterval(tick, 1000);
  }

  // ── Main button ────────────────────────────────────────────────────────────
  function handleMain() {
    if (ctx.state === 'suspended') ctx.resume();

    if (state === 'idle') {
      state = 'hanging'; tLeft = HANG;
      beep('up');
      startIv();
    } else if (state === 'paused') {
      state = prevState;
      startIv();
    } else if (state === 'done') {
      reset(); return;
    } else {
      prevState = state;
      state = 'paused';
      clearInterval(iv);
    }
    render();
  }

  function reset() {
    clearInterval(iv);
    state = 'idle'; exIdx = 0; rep = 0; tLeft = HANG;
    render();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const isDone = state === 'done';
    const safeIdx = Math.min(exIdx, EX.length - 1);
    const ex = EX[safeIdx];

    // Exercise info
    document.getElementById('exNum').textContent  = `Ejercicio ${safeIdx + 1} de ${EX.length}`;
    document.getElementById('exName').textContent  = isDone ? '¡Sesión completa!' : ex.name;
    document.getElementById('exGrip').textContent  = isDone ? 'Bien hecho 💪' : ex.grip;

    // Badge
    const badge = document.getElementById('badge');
    const bMap = {
      hanging: ['hang', '⬆  COLGADO'],
      resting: ['rest', '⬇  DESCANSO'],
      paused:  ['idle', '⏸  PAUSADO'],
      done:    ['done', '✓  COMPLETADO'],
      idle:    ['idle', 'Listo'],
    };
    const [cls, txt] = bMap[state] || ['idle', 'Listo'];
    badge.className = `badge ${cls}`;
    badge.textContent = txt;

    // Timer
    const timerEl = document.getElementById('timer');
    timerEl.textContent = isDone ? '✓' : tLeft;
    timerEl.className = `timer ${isDone ? 'done' : state === 'hanging' ? 'hang' : state === 'resting' ? 'rest' : 'idle'}`;

    // Rep dots
    const totalReps = ex.reps;
    document.getElementById('repLabel').textContent = isDone ? '' : `Rep ${rep + 1} de ${totalReps}`;
    const dots = document.getElementById('dots');
    dots.innerHTML = '';
    if (!isDone) {
      for (let i = 0; i < totalReps; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < rep ? ' done' : i === rep ? ' current' : '');
        dots.appendChild(d);
      }
    }

    // Progress
    const completedReps = EX.slice(0, safeIdx).reduce((s, e) => s + e.reps, 0) + (isDone ? EX[safeIdx].reps : rep);
    document.getElementById('progFill').style.width = (completedReps / TOTAL_REPS * 100) + '%';

    // Next label
    const nl = document.getElementById('nextLabel');
    if (!isDone && exIdx < EX.length - 1) {
      nl.innerHTML = `Siguiente: <span>${EX[exIdx + 1].name}</span>`;
    } else if (!isDone) {
      nl.innerHTML = `<span>Último ejercicio</span>`;
    } else {
      nl.innerHTML = '';
    }

    // Main button label
    const mb = document.getElementById('mainBtn');
    const labels = { idle: 'Empezar', paused: 'Continuar', done: 'Nueva sesión' };
    mb.textContent = labels[state] || 'Pausar';
  }

  // ── History ────────────────────────────────────────────────────────────────
  function logSession() {
    const h = JSON.parse(localStorage.getItem('abrahangs_log') || '[]');
    h.unshift({ ts: new Date().toISOString() });
    localStorage.setItem('abrahangs_log', JSON.stringify(h));
    renderHist();
  }

  function renderHist() {
    const h = JSON.parse(localStorage.getItem('abrahangs_log') || '[]');
    const el = document.getElementById('histList');
    if (!h.length) {
      el.innerHTML = '<div class="hist-empty">No hay sesiones todavía</div>';
      return;
    }
    el.innerHTML = h.slice(0, 15).map(e => {
      const d = new Date(e.ts);
      const ds = d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
      const ts = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      return `<div class="hist-item">
        <div class="hist-date">${ds} · ${ts}</div>
        <div class="hist-status">✓ Completada</div>
      </div>`;
    }).join('');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  render();
  renderHist();
  </script>
</body>
</html>
